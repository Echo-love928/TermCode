# 项目级放 <root>/.termcode.yaml；用户级放 ~/.termcode/config.yaml。
# 同名 server 项目级完整覆盖用户级，修改配置后需要重启。
# 只有 env / headers 的值展开 ${VAR}，command 和 args 保留原样。
mcp_servers:
  github:
    type: stdio
    command: npx
    args: ["-y", "@modelcontextprotocol/server-github"]
    env:
      GITHUB_TOKEN: "${GITHUB_TOKEN}"
  local-sqlite:
    type: stdio
    command: python
    args: ["-m", "mcp_server_sqlite", "--db", "./data.db"]
  example-http:
    type: http
    url: "https://mcp.example.com/mcp"
    headers:
      Authorization: "Bearer ${EXAMPLE_TOKEN}"

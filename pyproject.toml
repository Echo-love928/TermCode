[project]
name = "termcode"
version = "0.1.0"
description = "支持 Anthropic 和 OpenAI 兼容协议的终端对话助手"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "textual>=8.2,<9",
  "rich>=14,<16",
  "anthropic>=2.3,<3",
  "openai>=3.39,<4",
  "pyyaml>=6,<7",
  "textual-image[textual]>=0.14.2,<0.15",
  "pillow>=10.3,<14",
]

[project.scripts]
termcode = "termcode.cli:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/termcode"]

[tool.hatch.build.targets.sdist]
include = [
  "/src", "/tests", "/docs", "/README.md", "/pyproject.toml", "/uv.lock",
  "/.termcode/config.yaml.example", "/.termcode/settings.yaml.example",
  "/examples", "/smoke",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=1", "pytest-timeout>=2", "ruff>=0.6", "mypy>=1.10", "types-PyYAML>=6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
extend-exclude = [".cache", ".venv-linux"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.ruff.format]
exclude = ["*.md"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ASYNC109", "ASYNC110"]

[tool.mypy]
python_version = "3.12"
files = ["src/termcode"]
check_untyped_defs = true
disallow_untyped_defs = true

